[workspace]
resolver = "2"
members = [ "crates/*", "ecoinvent-example"]

[workspace.package]
# Centralized package metadata inherited by all crates.
version = "0.1.0"
edition = "2024"
rust-version = "1.77" # Assumed minimum Rust version; adjust if using newer features (edition 2024 implies nightly currently)
license = "MIT OR Apache-2.0"
repository = "https://github.com/zojeda/lca-rs-workspace"
authors = ["ClimateEarth Team <dev@climateearth.example>"]

[workspace.dependencies]
wgpu = "25.0.0" 
futures = "0.3"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] } # Optional for WASM builds
wasm-bindgen-futures = { version = "0.4" } # Optional for WASM builds
cfg-if = "1.0"
bytemuck = { version = "1.14", features = ["derive"] } # Match lca-lsolver's version
log = "0.4" # For logging facade
thiserror = "1.0" # For error handling
num-traits = "0.2" # Added dependency
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
derive_more = { version = "2.0.1", features = ["from", "error", "display"] }
pollster = "0.3"
tokio = { version = "1", features = ["full"] }
wasm-logger = { version = "0.2" }
console_error_panic_hook = { version = "0.1" }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
fastrand = { version = "2.3.0", default-features = false, features = ["getrandom"] }
env_logger = "0.11"
uuid = { version = "1.17", features = ["serde", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
criterion = { version = "0.7", features = ["async_tokio"] } # Benchmark dependency unified at required version
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.18", features = ["derive"] }
axum-streams = { version = "0.21", features = ["json"] }

[workspace.lints]
rust.unused_crate_dependencies = "warn"
rust.unused_extern_crates = "warn"
rust.unused_imports = "warn"
rust.unreachable_pub = "deny"
rust.missing_docs = "warn"
clippy.all = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }
clippy.nursery = { level = "warn", priority = -1 }
clippy.unwrap_used = "deny"
clippy.expect_used = "deny"
clippy.todo = "deny"
clippy.unimplemented = "deny"
clippy.use_self = "warn"
clippy.enum_glob_use = "deny"
clippy.wildcard_imports = "deny"
clippy.disallowed_methods = "warn"
