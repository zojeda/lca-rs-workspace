[package]
name = "lca-lsolver"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"] # For WASM and native library builds

[dependencies]
futures.workspace = true
num-traits.workspace = true
wasm-bindgen = { workspace = true, optional = true } # Optional for WASM builds
cfg-if = { workspace = true}
bytemuck.workspace = true
log.workspace = true  # For logging facade
thiserror.workspace = true # For error handling, potentially useful
lca-core = { path = "../lca-core" }

# Optional native dependency for direct sparse solver (Intel MKL PARDISO)
# Note: Requires Intel oneAPI MKL available at build/run time.
pardiso-wrapper = { version = "0.1.2", optional = true, features = ["mkl"] }

# Native-specific dependencies (optional, e.g., for native examples or testing)
pollster = { workspace = true, optional = true }
fastrand.workspace = true

[dev-dependencies]
env_logger.workspace = true
pollster.workspace = true # Simple executor for running async examples/tests
tokio.workspace = true # Needed for #[tokio::main] in examples
# No specific dev-dependencies needed beyond regular ones for now
criterion.workspace = true # Uses workspace unified version 0.7

[[bench]]
name = "pentadiagonal"
harness = false

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true } # Non-optional for WASM target
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
console_error_panic_hook = { workspace = true, optional = true} # Useful for debugging WASM panics
wasm-logger = { workspace = true, optional = true} # Optional logger for WASM
js-sys.workspace = true

[features]
default = ["native"] # Default to native build features
native = ["pollster"] # Features needed for native execution
wasm = ["wasm-bindgen", "console_error_panic_hook", "wasm-logger"] # Features needed for WASM build/execution
## Enable PARDISO-based direct solver (native only)
pardiso = ["pardiso-wrapper"]
