[package]
name = "ecospold-parser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize", "overlapped-lists"] } # Correct feature for Serde support
serde_json = "1.0" # Added again for flexible comment parsing
derive_more = { version = "2.0.1", features = ["from", "error", "display"] }
